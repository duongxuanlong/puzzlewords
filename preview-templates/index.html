<!--
  Project preview template (Cocos Creator 2.4 "custom preview template"): the editor serves this
  instead of its built-in page at http://localhost:7456. Same toolbar as the stock page; the only
  behavioural change lives in boot.js: the "Default" device fits the game into the browser window
  instead of forcing the full 1080x1920 design size, so the preview never scrolls.
-->
<html>
<head>
  <link rel="icon" href="app/editor/static/preview-templates/favicon.ico">
  <meta charset="utf-8">
  <title><%=title%></title>
  <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1, minimum-scale=1,maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="full-screen" content="yes">
  <meta name="screen-orientation" content="portrait">
  <meta name="x5-fullscreen" content="true">
  <meta name="360-fullscreen" content="true">
  <meta name="renderer" content="webkit">
  <meta name="force-rendering" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="toolbar">
    <div class="item">
      <select id="opts-device">
        <option value="0">Fit window</option>
      </select>
    </div>
    <div class="item"><button id="btn-rotate">Rotate</button></div>
    <span class="item" style="font-size: small;">Debug Mode:</span>
    <div class="item">
      <select id="opts-debug-mode">
        <option value="0">None</option>
        <option value="1">Info</option>
        <option value="2">Warn</option>
        <option value="3">Error</option>
        <option value="4">Info For Web Page</option>
        <option value="5">Warn For Web Page</option>
        <option value="6">Error For Web Page</option>
      </select>
    </div>
    <div class="item"><button id="btn-show-fps">Show FPS</button></div>
    <div class="item">
      <span class="item" style="font-size: small;">FPS:</span>
      <input id="input-set-fps" type="number">
    </div>
    <div class="item" style="margin-right: 0px;"><button id="btn-pause">Pause</button></div>
    <div class="item"><button id="btn-step" style="display: none;">Step</button></div>
    <div class="item"><button id="btn-recompile">Recompile</button></div>
  </div>

  <div class="content" id="content">
    <div class="contentWrap">
      <div class="wrapper" id="GameDiv">
        <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
        <div id="splash">
          <div class="progress-bar stripes"><span></span></div>
        </div>
        <div id="bulletin">
          <div class="inner" id="sceneIsEmpty">Current scene is empty.</div>
        </div>
      </div>
    </div>
  </div>
  <div id="recompiling"><span>Recompiling scripts, please wait for refresh...</span></div>

  <script type="text/javascript" charset="utf-8" src="settings.js"></script>
  <script type="text/javascript" charset="utf-8" src="preview-scripts/__quick_compile__.js"></script>
  <script type="text/javascript" charset="utf-8" src="boot.js"></script>
  <script type="text/javascript" charset="utf-8" src="/socket.io/socket.io.js"></script>
  <script type="text/javascript">
    window.__socket_io__ = window.io;
  </script>
  <script type="text/javascript" charset="utf-8" src="app/engine/bin/<%=cocos2d%>"></script>
</body>
</html>
